<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparateur Screenshots by funkydata</title>
    <style>
        :root { --accent: #00d4ff; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Fond noir total pour les bords */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .comp-container {
            position: relative;
            width: min(1920px, 100vw, calc(100vh * 16 / 9));
            aspect-ratio: 16 / 9;
            
            background: #050505;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            
            /* Optionnel liseré noir autour */
            margin: auto; 
        }

        /* Calques d'images */
        .img-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover; /* 'cover' ici car le conteneur a déjà le bon ratio */
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .before-layer { z-index: 2; clip-path: inset(0 50% 0 0); }
        .after-layer { z-index: 1; }

        /* Slider & Ligne */
        .slider-line { position: absolute; top: 0; bottom: 0; width: 2px; background: white; left: 50%; z-index: 4; pointer-events: none; }
        .slider-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; cursor: ew-resize; background: transparent; -webkit-appearance: none; appearance: none; margin: 0; outline: none; }

        /* Interface (Labels et Nav) */
        .label { position: absolute; top: 20px; z-index: 6; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }
        .label-before { left: 20px; border-left: 4px solid var(--accent); }
        .label-after { right: 20px; border-right: 4px solid var(--accent); }

        .scene-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 6; background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 20px; font-size: 16px; border: 1px solid var(--accent); }

        /* Navigation */
        .nav-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); }
        .nav-btn { background: none; border: 1px solid white; color: white; padding: 5px 15px; cursor: pointer; border-radius: 20px; transition: 0.2s; font-weight: bold; }
        .nav-btn:hover { background: white; color: black; }
        .counter { font-family: monospace; font-size: 14px; min-width: 50px; text-align: center; }

        .fs-toggle { position: absolute; bottom: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.8); border: 1px solid white; color: white; padding: 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div class="comp-container" id="app">
    <div class="label label-before">CP2077 PT + RR + Nova Suite</div>
    <div id="title" class="scene-title">Chargement...</div>
    <div class="label label-after">CP2077 PT + RR + Funkydata Suite</div>

    <div id="after" class="img-layer after-layer"></div>
    <div id="before" class="img-layer before-layer"></div>
    <div id="line" class="slider-line"></div>

    <input type="range" min="0" max="100" value="50" class="slider-input" id="slider">

    <div class="nav-controls">
        <button class="nav-btn" onclick="prev()">Précédent</button>
        <span class="counter" id="counter">1 / 1</span>
        <button class="nav-btn" onclick="next()">Suivant</button>
    </div>

    <button class="fs-toggle" onclick="toggleFS()">⛶</button>
</div>

<script>
    // --- CONFIGURATION DES IMAGES ---
    const scenes = [
        {
            title: "Apartement V 01",

            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0001_2.png"
        },
        {
            title: "Apartement Blocs 01",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0002_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0002_2.png"
        },
        {
            title: "Apartement Blocs 02",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0003_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0003_2.png"
        },
        {
            title: "Exterieur 001",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0004_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0004_2.png"
        },
        {
            title: "Exterieur 002",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0005_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0005_2.png"
        },
        {
            title: "Exterieur 003",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0006_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0006_2.png"
        },
        {
            title: "Jackie 001",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0007_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0007_2.png"
        },
        {
            title: "Jackie 002",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0008_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0008_2.png"
        },
        {
            title: "Première Conduite",
            original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0009_1.png",
            reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0009_2.png"
        },
        {
			title: "Boutique de Misty 01",
			original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0010_1.png",
			reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0010_2.png"
        },
        {
			title: "Boutique de Misty Arr 01",
			original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0011_1.png",
			reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0011_2.png"
        },
        {
			title: "Viktor 01",
			original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0012_1.png",
			reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0012_2.png"
        },
        {
			title: "Boutique de Viktor 01",
			original: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0013_1.png",
			reshade: "https://funkydata13.github.io/assets/img/dossiers/cp2077/Cyberpunk2077_0013_2.png"
        }
        // Ajoutez vos autres couples ici
    ];

    let currentIndex = 0;

    const slider = document.getElementById('slider');
    const before = document.getElementById('before');
    const after = document.getElementById('after');
    const line = document.getElementById('line');
    const title = document.getElementById('title');
    const counter = document.getElementById('counter');

    // Initialisation au chargement
    function init() {
        // Lire l'ID dans l'URL (?id=0)
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));
        if (!isNaN(id) && id >= 0 && id < scenes.length) {
            currentIndex = id;
        }
        updateDisplay();
    }

    function updateDisplay() {
        const scene = scenes[currentIndex];
        
        // 1. On charge les images de la scène actuelle d'abord
        before.style.backgroundImage = `url('${scene.original}')`;
        after.style.backgroundImage = `url('${scene.reshade}')`;
        
        title.innerText = scene.title;
        counter.innerText = `${currentIndex + 1} / ${scenes.length}`;
    
        // 2. On attend 1.5 seconde (une fois que l'actuelle est normalement affichée)
        // pour précharger la SUIVANTE en toute discrétion.
        setTimeout(() => {
            const nextIndex = (currentIndex + 1) % scenes.length;
            const nextScene = scenes[nextIndex];
            
            const imgPreload1 = new Image();
            const imgPreload2 = new Image();
            imgPreload1.src = nextScene.original;
            imgPreload2.src = nextScene.reshade;
            
            console.log("Préchargement de la scène suivante : " + nextScene.title);
        }, 1500);
    
        // Mise à jour URL
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${currentIndex}`;
        window.history.pushState({path:newUrl},'',newUrl);
    }

    function next() {
        currentIndex = (currentIndex + 1) % scenes.length;
        updateDisplay();
    }

    function prev() {
        currentIndex = (currentIndex - 1 + scenes.length) % scenes.length;
        updateDisplay();
    }

    slider.addEventListener('input', (e) => {
        const v = e.target.value;
        before.style.clipPath = `inset(0 ${100 - v}% 0 0)`;
        line.style.left = v + '%';
    });

    function toggleFS() {
        if (!document.fullscreenElement) document.getElementById('app').requestFullscreen();
        else document.exitFullscreen();
    }

    init();
</script>

</body>
</html>
